<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony 5.1 Revival</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #bb86fc; }
        .control-group { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        button { background: #333; color: white; border: none; padding: 15px 25px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #444; }
        button.active { background: #bb86fc; color: black; }
        input[type=range] { width: 100%; margin: 20px 0; }
        .status { font-size: 14px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sony 5.1 System</h1>
        
        <div class="control-group">
            <h3>Volume</h3>
            <input type="range" id="vol" min="0" max="255" value="128" onchange="setVolume(this.value)">
            <p>Level: <span id="vol-lbl">128</span></p>
            <button id="btn-mute" onclick="toggleMute()">Mute</button>
        </div>
        
        <div class="control-group">
            <h3>Input</h3>
            <button id="inp-0" onclick="setInput('bt')">Bluetooth</button>
            <button id="inp-1" onclick="setInput('aux')">AUX</button>
            <button id="inp-2" onclick="setInput('usb')">USB</button>
        </div>
        
        <div class="control-group">
            <h3>Power</h3>
            <button id="btn-power" onclick="togglePower()">Power</button>
        </div>

        <div class="status">
            <p>Temp: <span id="temp">--</span>°C</p>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://' + window.location.hostname + '/ws');
        
        ws.onmessage = function(e) {
            const data = JSON.parse(e.data);
            document.getElementById('vol').value = data.volume;
            document.getElementById('vol-lbl').innerText = data.volume;
            
            document.getElementById('btn-mute').classList.toggle('active', data.muted);
            document.getElementById('btn-power').classList.toggle('active', data.relayEngaged);
            
            document.getElementById('temp').innerText = data.temp.toFixed(1);
        };

        function setVolume(val) {
            fetch('/api/volume', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({level: parseInt(val)}) });
        }
        function toggleMute() { fetch('/api/mute', { method: 'POST' }); }
        function togglePower() { fetch('/api/power', { method: 'POST' }); }
        function setInput(src) { fetch('/api/input', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({source: src}) }); }
    </script>
</body>
</html>
